<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurboFlow Bridge</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- ====== Main View ====== -->
  <div id="view-main" class="view active">
    <header class="header">
      <div class="header-info">
        <h1>TurboFlow Bridge</h1>
        <code id="bridge-id">Loading...</code>
      </div>
      <div class="header-actions">
        <button id="btn-test" class="btn-icon" title="Test Translate" data-nav="test">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M3 2l10 6-10 6V2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="btn-settings" class="btn-icon" title="Settings" data-nav="settings">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="btn-logs" class="btn-icon" title="Logs" data-nav="logs">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M2 2h12M2 6h8M2 10h10M2 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="status-bar">
      <span id="status-dot" class="dot disconnected"></span>
      <span id="status-text">Checking...</span>
      <button id="btn-open-flow" class="btn-open-flow hidden">Open Flow</button>
    </section>

    <section class="panel stats-panel">
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-item stat-success">
          <span class="stat-value" id="stat-success">0</span>
          <span class="stat-label">Success</span>
        </div>
        <div class="stat-item stat-failed">
          <span class="stat-value" id="stat-failed">0</span>
          <span class="stat-label">Failed</span>
        </div>
      </div>
    </section>

    <section class="panel current-task-panel">
      <div class="section-title">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 7l2 2 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        CURRENT TASK
        <span id="countdown" class="countdown"></span>
      </div>
      <div id="current-task" class="task-card idle">
        <span class="task-status-badge idle">Idle</span>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        TASK HISTORY
      </div>
      <div id="task-table-wrap">
        <table class="task-table" id="task-table">
          <thead>
            <tr><th>Images</th><th>Status</th><th>Elapsed</th><th>Time</th><th>Prompt</th></tr>
          </thead>
          <tbody id="task-tbody"></tbody>
        </table>
        <div id="task-empty" class="empty-state">No tasks yet</div>
      </div>
      <div id="pagination" class="pagination"></div>
    </section>
  </div>

  <!-- ====== Settings View ====== -->
  <div id="view-settings" class="view">
    <header class="page-header">
      <button class="btn-back" data-nav="main">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
          <path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
      <h1>Server Settings</h1>
    </header>
    <div class="page-body">
      <div id="services"></div>
      <div class="btn-group">
        <button id="btn-add-service" class="secondary">+ Add Service</button>
        <button id="btn-save" class="primary">Save</button>
      </div>
      <div id="toast" class="toast hidden"></div>
    </div>
  </div>

  <!-- ====== Test View ====== -->
  <div id="view-test" class="view">
    <header class="page-header">
      <button class="btn-back" data-nav="main">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
          <path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
      <h1>Test Translate</h1>
    </header>
    <div class="page-body test-body">
      <div class="test-field">
        <label class="test-label">Source Image</label>
        <div id="test-drop-zone" class="test-drop-zone">
          <input type="file" id="test-file" accept="image/*" hidden>
          <div id="test-drop-placeholder" class="test-drop-placeholder">
            <svg width="28" height="28" viewBox="0 0 16 16" fill="none">
              <path d="M2 11l3-4 2.5 3L10 7l4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="1" y="1" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.2"/>
            </svg>
            <span>Click or drag image here</span>
          </div>
          <img id="test-preview" class="test-preview hidden" alt="preview">
        </div>
      </div>
      <div class="test-field">
        <label class="test-label">Aspect Ratio</label>
        <select id="test-aspect">
          <option value="auto">Auto (from image)</option>
          <option value="IMAGE_ASPECT_RATIO_SQUARE">1:1</option>
          <option value="IMAGE_ASPECT_RATIO_LANDSCAPE_THREE_TWO">3:2</option>
          <option value="IMAGE_ASPECT_RATIO_PORTRAIT_TWO_THREE">2:3</option>
          <option value="IMAGE_ASPECT_RATIO_PORTRAIT_THREE_FOUR">3:4</option>
          <option value="IMAGE_ASPECT_RATIO_LANDSCAPE_FOUR_THREE">4:3</option>
          <option value="IMAGE_ASPECT_RATIO_PORTRAIT_FOUR_FIVE">4:5</option>
          <option value="IMAGE_ASPECT_RATIO_LANDSCAPE_FIVE_FOUR">5:4</option>
          <option value="IMAGE_ASPECT_RATIO_PORTRAIT">9:16</option>
          <option value="IMAGE_ASPECT_RATIO_LANDSCAPE">16:9</option>
          <option value="IMAGE_ASPECT_RATIO_ULTRAWIDE">21:9</option>
        </select>
      </div>
      <div class="test-field">
        <label class="test-label">Model</label>
        <select id="test-model">
          <option value="GEM_PIX_2">Nano Banana Pro</option>
          <option value="NARWHAL">Nano Banana 2</option>
          <option value="IMAGEN_3_5">Imagen 4</option>
        </select>
      </div>
      <div class="test-field">
        <label class="test-label">Target Language</label>
        <input id="test-lang" type="text" value="Simplified Chinese" placeholder="e.g. Japanese, Korean...">
      </div>
      <div class="test-field">
        <label class="test-label">Prompt</label>
        <textarea id="test-prompt" rows="6" placeholder="Leave empty to use default prompt"></textarea>
      </div>
      <button id="btn-test-run" class="primary test-run-btn" disabled>Translate</button>
      <div id="test-status" class="test-status hidden"></div>
      <div id="test-result" class="test-result hidden">
        <label class="test-label">Result</label>
        <div class="test-result-images">
          <div class="test-result-col">
            <span class="test-result-tag">Source</span>
            <img id="test-result-src" alt="source">
          </div>
          <div class="test-result-col">
            <span class="test-result-tag">Translated</span>
            <img id="test-result-out" alt="result">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== Logs View ====== -->
  <div id="view-logs" class="view">
    <header class="page-header">
      <button class="btn-back" data-nav="main">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
          <path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
      <h1>Logs</h1>
      <span id="log-count" class="log-count"></span>
      <label class="auto-scroll-label" title="Auto scroll to latest log">
        <input type="checkbox" id="chk-auto-scroll" checked>
        <span>Auto</span>
      </label>
      <button id="btn-clear-logs" class="btn-clear">Clear</button>
    </header>
    <div class="logs-container">
      <div id="logs" class="logs"></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
