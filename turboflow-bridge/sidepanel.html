<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurboFlow Bridge</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="header">
    <div class="header-info">
      <h1>TurboFlow Bridge</h1>
      <code id="bridge-id">Loading...</code>
    </div>
    <button id="btn-check" class="btn-icon" title="Check connection">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M13.65 2.35a8 8 0 1 0 0 11.3M14 8A6 6 0 1 1 8 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Check
    </button>
  </header>

  <section class="status-card">
    <div class="status-row">
      <span id="status-dot" class="dot disconnected"></span>
      <span id="status-text">Checking Flow...</span>
    </div>
    <button id="btn-open-flow" class="btn-accent open-flow hidden">打开 Google Flow</button>
  </section>

  <section class="panel">
    <div class="section-title">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Services
    </div>
    <div id="services"></div>
    <div class="btn-group">
      <button id="btn-add-service" class="secondary">+ Add Service</button>
      <button id="btn-save" class="primary">Save</button>
    </div>
  </section>

  <section class="panel">
    <div class="section-title">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4 7l2 2 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Current Task
    </div>
    <pre id="task-state" class="task-display">Idle</pre>
  </section>

  <section class="panel">
    <div class="section-title">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M2 2h12M2 6h8M2 10h10M2 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Logs
    </div>
    <div id="logs" class="logs"></div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
