<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs - TurboFlow Bridge</title>
  <link rel="stylesheet" href="sidepanel.css">
  <style>
    .logs-container {
      height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 10px 14px;
    }
    .log-count {
      margin-left: auto;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
    }
    .btn-clear {
      padding: 4px 10px;
      font-size: 11px;
      color: var(--red);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .btn-clear:hover {
      background: rgba(239, 100, 97, .1);
      border-color: var(--red);
    }
  </style>
</head>
<body>
  <header class="page-header">
    <button id="btn-back" class="btn-back">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
        <path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>
    <h1>Logs</h1>
    <span id="log-count" class="log-count"></span>
    <button id="btn-clear" class="btn-clear">Clear</button>
  </header>

  <div class="logs-container">
    <div id="logs" class="logs"></div>
  </div>

  <script src="logs.js"></script>
</body>
</html>
