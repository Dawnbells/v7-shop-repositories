# ============================================================================
# v7 前端机 nginx 主配置（静态部分）
#
# 动态内容全部来自 /data/v7-front/active/（agent 渲染的不可变 release）：
#   _system/*.conf  —— 按资源配额计算的尺寸参数（worker/连接数/缓存区/日志开关）
#   <公司>/*.map    —— 各公司的域名路由、证书路径、缓存档位
#   <公司>/upstreams.conf —— 各公司的服务地址
#
# 本文件不包含任何「会随域名增删而变化」的内容——域名变更只改 active/ 下的产物。
# 设计文档：docs/superpowers/specs/2026-06-12-nginx-config-refactor-design.md §4.3
# ============================================================================

user  nginx;
include /data/v7-front/active/_system/main.conf;
error_log  /data/v7-front/logs/error.log warn;
pid        /var/run/nginx.pid;

events {
    include /data/v7-front/active/_system/events.conf;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 统一访问日志格式：含 $host 字段，可按域名 grep（开关在 _system/http.conf，默认 off）
    log_format vhost '$remote_addr - [$time_local] "$host" '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time '
                     'cache=$upstream_cache_status';

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # 万级域名的 map 哈希必须显式扩容（默认 2048 会 nginx -t 失败）；bucket 256 兼容超长域名
    map_hash_max_size    65536;
    map_hash_bucket_size 256;

    # 尺寸类参数由 agent 按资源配额渲染（proxy_cache_path / ssl_certificate_cache /
    # ssl_session_cache / access_log 开关）
    include /data/v7-front/active/_system/http.conf;

    # ── 三张核心 map（hostnames 模式：".example.com" 同时匹配主域与全部子域）──

    # SNI → 证书目录；未知域名用占位证书完成握手（HTTP 层随后 444）
    map $ssl_server_name $cert_dir {
        hostnames;
        default /data/v7-front/placeholder;
        include /data/v7-front/active/*/certs.map;
    }

    # Host → upstream 名；空值 = 未知域名
    map $host $backend {
        hostnames;
        default "";
        include /data/v7-front/active/*/routes.map;
    }

    # Host → /static/ 的缓存档位：legacy(THYMELEAF/VIKE) 域名 IMAGE_CACHE，其余 off
    map $host $image_cache {
        hostnames;
        default off;
        include /data/v7-front/active/*/caches.map;
    }

    # 由缓存档位推导 /static/ 的响应缓存头：仅 legacy 域名强缓存，
    # nuxt 域名的 /static/ 行为与旧模板一致（不加 expires，add_header 空值不输出）
    map $image_cache $static_expires {
        default     off;
        IMAGE_CACHE 1y;
    }
    map $image_cache $static_cache_control {
        default     "";
        IMAGE_CACHE "public, max-age=31536000, immutable";
    }

    # 各公司 upstream 块（<公司>_<服务类型>）
    include /data/v7-front/active/*/upstreams.conf;

    # ── 80：全域跳转 https ──
    # 证书走云平台 DNS 验证，没有 HTTP-01 回调，这里不需要任何 per-domain 内容
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── 443：唯一的通用 server，全部域名共用 ──
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # 变量证书路径：握手期按 SNI 从 map 取目录加载，
        # 性能由 _system/http.conf 里的 ssl_certificate_cache 保证（nginx ≥ 1.27.4）
        ssl_certificate     $cert_dir/fullchain.pem;
        ssl_certificate_key $cert_dir/privkey.pem;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "DEFAULT:@SECLEVEL=1";
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # 未知域名：占位证书完成握手后直接断连（不回任何内容）
        if ($backend = "") { return 444; }

        # 反代公共头（location 未另行定义 proxy_set_header 时自动继承）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;

        # nuxt 构建产物：强缓存一年（与旧 NUXT_MALL 模板等价）
        location /_nuxt/ {
            proxy_pass http://$backend;
            proxy_cache NUXT_CACHE;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # legacy 图片/静态：缓存档位与响应头都由 map 按域名类型决定
        location /static/ {
            proxy_pass http://$backend;
            proxy_cache $image_cache;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_valid 200 301 302 30d;
            add_header X-Cache-Status $upstream_cache_status;
            expires $static_expires;
            add_header Cache-Control $static_cache_control;
        }

        location / {
            proxy_pass http://$backend;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 96k;
        }
    }
}
