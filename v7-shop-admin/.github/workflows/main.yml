name: Build and Deploy on Tag Release
on:
  push:
    tags:
      - 'V*' # 匹配所有 v 开头的 tag，如 v1.0.0, v2.3.4

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [ht, xyz] # 定义所有要构建的模式
    name: Build and Deploy (${{ matrix.mode }})

    steps:
      - name: Checkout code (with tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 确保获取完整的 Git 历史记录（可选，某些构建可能需要）

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build project for ${{ matrix.mode }}
        run: pnpm build:${{ matrix.mode }}

      - name: Install B2 CLI
        run: pip3 install --upgrade --ignore-installed b2

      - name: Upload via B2 CLI
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/V}
          b2 file upload v7-soft-depository \
            dist/website.zip \
            "releases/admin/${{ matrix.mode }}/versions/admin-${{ matrix.mode }}-$VERSION.zip"

          b2 file upload v7-soft-depository \
            dist/website.zip \
            "releases/admin/${{ matrix.mode }}/admin-${{ matrix.mode }}-latest.zip"

